<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina(titulo='Anotação', conteudo=~{::conteudo})}">
<body>
<div th:fragment="conteudo">
    <div class="cab">
        <div><h1 th:text="${nota.id == null ? 'Nova anotação' : nota.title}">Anotação</h1></div>
        <a class="btn fantasma" th:href="@{/anotacoes}">← Voltar</a>
    </div>
    <form th:action="${nota.id == null ? '/anotacoes' : '/anotacoes/' + nota.id}" method="post"
          th:attr="data-autosave=${nota.id != null ? '/anotacoes/' + nota.id + '/autosave' : null}">
        <div th:if="${nota.id != null}" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
            <span class="save-state" data-autosave-estado>✓ Salvo</span>
            <span class="cresce" style="flex:1"></span>
            <label class="check"><input type="checkbox" name="favorite" value="true" th:checked="${nota.favorite}"> Favorita</label>
            <label class="check"><input type="checkbox" name="archived" value="true" th:checked="${nota.archived}"> Arquivada</label>
        </div>
        <div class="campo"><label for="title">Título</label>
            <input id="title" name="title" type="text" th:value="${nota.title}" data-autosave-campo="title" maxlength="200" required></div>
        <div class="form-linha">
            <div class="campo"><label for="category">Categoria</label>
                <input id="category" name="category" type="text" th:value="${nota.category}" data-autosave-campo="category" maxlength="80"></div>
            <div class="campo"><label for="tags">Tags (separadas por vírgula)</label>
                <input id="tags" name="tags" type="text" th:value="${nota.tagsCsv}" data-autosave-campo="tags" maxlength="500"></div>
        </div>
        <div class="campo">
            <label>Conteúdo</label>
            <div data-editor>
                <div class="editor-barra" role="toolbar" aria-label="Formatação">
                    <button data-cmd="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
                    <button data-cmd="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
                    <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>U</u></button>
                    <button data-cmd="formatBlock" data-valor="h2" title="Título">H</button>
                    <button data-cmd="formatBlock" data-valor="p" title="Texto normal">¶</button>
                    <button data-cmd="insertUnorderedList" title="Lista">•≡</button>
                    <button data-cmd="insertOrderedList" title="Lista numerada">1≡</button>
                    <button data-cmd="formatBlock" data-valor="blockquote" title="Citação">❝</button>
                    <button data-cmd="createLink" title="Link">🔗</button>
                    <button data-cmd="removeFormat" title="Limpar formatação">✕</button>
                    <button data-cmd="undo" title="Desfazer">↩</button>
                    <button data-cmd="redo" title="Refazer">↪</button>
                    <button data-cmd="insertHorizontalRule" title="Separador">―</button>
                    <button data-cmd="formatBlock" data-valor="pre" title="Código">{ }</button>
                </div>
                <div class="editor-area" data-editor-area contenteditable="true" aria-label="Conteúdo da anotação"></div>
                <input type="hidden" name="content" data-editor-hidden data-autosave-campo="content" th:value="${nota.content}">
            </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn primario" type="submit">Salvar</button>
        </div>
    </form>
    <div style="display:flex;gap:10px;margin-top:14px" th:if="${nota.id != null}">
        <form th:action="@{'/anotacoes/' + ${nota.id} + '/favoritar'}" method="post">
            <button class="btn pequeno" type="submit" th:text="${nota.favorite ? '★ Desfavoritar' : '☆ Favoritar'}">Favoritar</button>
        </form>
        <form th:action="@{'/anotacoes/' + ${nota.id} + '/excluir'}" method="post" data-confirmar="Excluir esta anotação? Esta ação não pode ser desfeita.">
            <button class="btn pequeno perigo" type="submit">Excluir</button>
        </form>
    </div>
    <script th:src="@{/js/editor.js}" defer></script>
    <script th:src="@{/js/autosave.js}" defer></script>
</div>
</body>
</html>
