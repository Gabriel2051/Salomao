<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina(titulo=${mapa.title}, conteudo=~{::conteudo})}">
<body>
<div th:fragment="conteudo">
    <div class="cab">
        <div><h1 th:text="${mapa.title}">Mapa</h1>
            <p><span data-autosave-estado>✓ Salvo</span> · duplo-clique no fundo cria um nó · arraste para mover · clique numa aresta para remover</p></div>
        <a class="btn fantasma" th:href="@{/mapas}">← Voltar</a>
    </div>
    <div th:attr="data-autosave='/mapas/' + ${mapa.id} + '/grafo'" data-autosave-coletar="grafo" data-autosave-intervalo="2000">
    <div class="mapa-wrap">
        <div class="mapa-barra">
            <button class="btn pequeno" id="mapaNovoNo" type="button">＋ Nó</button>
            <button class="btn pequeno fantasma" id="mapaZoomMais" type="button" aria-label="Aproximar">＋ Zoom</button>
            <button class="btn pequeno fantasma" id="mapaZoomMenos" type="button" aria-label="Afastar">− Zoom</button>
            <button class="btn pequeno fantasma" id="mapaCentralizar" type="button">Centralizar</button>
            <span class="muted" style="font-size:12px">Tipos: texto, personagem, poder, história, anotação, categoria, livre</span>
        </div>
        <svg id="mapaCanvas" th:attr="data-mapa-id=${mapa.id}" viewBox="0 0 1000 560" role="application" aria-label="Editor de mapa mental">
            <defs>
                <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
                    <circle cx="1.5" cy="1.5" r="1.5" fill="#222"/>
                </pattern>
            </defs>
            <rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#grade)" opacity="0.5"/>
            <g id="mapaViewport"><g id="mapaArestas"></g><g id="mapaNos"></g></g>
        </svg>
    </div>
    </div>
    <div class="detalhe-grade" style="margin-top:16px">
        <section class="painel">
            <h2>Nó selecionado</h2>
            <div id="mapaPainel"><p class="muted">Selecione um nó.</p></div>
        </section>
        <section class="painel">
            <h2>Mapa</h2>
            <form th:action="@{'/mapas/' + ${mapa.id}}" method="post">
                <div class="campo"><label for="title">Título</label><input id="title" name="title" type="text" th:value="${mapa.title}" maxlength="160" required></div>
                <div class="campo"><label for="description">Descrição</label><textarea id="description" name="description" rows="3" th:text="${mapa.description}"></textarea></div>
                <button class="btn pequeno primario" type="submit">Renomear</button>
            </form>
            <form th:action="@{'/mapas/' + ${mapa.id} + '/excluir'}" method="post" style="margin-top:10px" data-confirmar="Excluir este mapa e todos os seus nós?">
                <button class="btn pequeno perigo" type="submit">Excluir mapa</button>
            </form>
        </section>
    </div>
    <script th:src="@{/js/mindmap.js}" defer></script>
    <script th:src="@{/js/autosave.js}" defer></script>
</div>
</body>
</html>
