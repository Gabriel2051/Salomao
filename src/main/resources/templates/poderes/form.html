<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina(titulo=${poder.id == null ? 'Novo poder' : poder.name}, conteudo=~{::conteudo})}">
<body>
<div th:fragment="conteudo">
    <div class="cab">
        <div><h1 th:text="${poder.id == null ? 'Novo poder' : 'Editar poder'}">Poder</h1></div>
        <a class="btn fantasma" th:href="${poder.id == null ? '/poderes' : '/poderes/' + poder.id}">← Voltar</a>
    </div>
    <form th:action="${poder.id == null ? '/poderes' : '/poderes/' + poder.id}" method="post">
        <div class="campo"><label for="name">Nome *</label><input id="name" name="name" type="text" th:value="${poder.name}" maxlength="160" required></div>
        <div class="form-linha">
            <div class="campo"><label for="category">Categoria</label><input id="category" name="category" type="text" th:value="${poder.category}" maxlength="80"></div>
            <div class="campo"><label for="level">Nível</label><input id="level" name="level" type="text" th:value="${poder.level}" maxlength="40" placeholder="ex.: Iniciante, Lendário, Ômega"></div>
        </div>
        <div class="campo"><label for="description">Descrição</label><textarea id="description" name="description" rows="4" th:text="${poder.description}"></textarea></div>
        <div class="form-linha">
            <div class="campo"><label for="limitations">Limitações</label><textarea id="limitations" name="limitations" rows="3" th:text="${poder.limitations}"></textarea></div>
            <div class="campo"><label for="weaknesses">Fraquezas</label><textarea id="weaknesses" name="weaknesses" rows="3" th:text="${poder.weaknesses}"></textarea></div>
        </div>
        <div class="campo"><label for="origin">Origem</label><textarea id="origin" name="origin" rows="3" th:text="${poder.origin}"></textarea></div>
        <div class="campo"><label for="observations">Observações</label><textarea id="observations" name="observations" rows="3" th:text="${poder.observations}"></textarea></div>
        <button class="btn primario" type="submit">Salvar poder</button>
    </form>
</div>
</body>
</html>
