<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina(titulo='Poderes', conteudo=~{::conteudo})}">
<body>
<div th:fragment="conteudo">
    <div class="cab">
        <div><h1>Poderes</h1><p>Tokens compactos — clique para ver detalhes.</p></div>
        <a class="btn primario" th:href="@{/poderes/novo}">＋ Novo poder</a>
    </div>
    <div class="barra-ferramentas">
        <form class="pesquisa-form" th:action="@{/poderes}" method="get">
            <input type="search" name="q" th:value="${q}" placeholder="Pesquisar poderes…" aria-label="Pesquisar poderes">
            <button class="btn" type="submit">Buscar</button>
        </form>
    </div>
    <div class="tokens" th:if="${!itens.empty}" style="margin-bottom:16px">
        <span class="token" th:each="p : ${itens.content}" th:data-poder-id="${p.id}" th:text="'✦ ' + ${p.name}" role="button" tabindex="0">poder</span>
    </div>
    <div class="grade">
        <a class="cartao" th:each="p : ${itens.content}" th:href="@{'/poderes/' + ${p.id}}">
            <h3 th:text="'✦ ' + ${p.name}">nome</h3>
            <p th:text="${p.category}" th:if="${!#strings.isEmpty(p.category)}">cat</p>
            <span class="meta"><span th:text="${p.level}" th:if="${!#strings.isEmpty(p.level)}">nível</span></span>
        </a>
    </div>
    <div class="vazio" th:if="${itens.empty}">Nenhum poder ainda.<br><a class="btn primario" th:href="@{/poderes/novo}">Criar o primeiro</a></div>
    <div class="paginacao" th:if="${itens.totalPages > 1}">
        <a class="btn pequeno" th:if="${!itens.first}" th:href="@{/poderes(pagina=${itens.number - 1}, q=${q})}">← Anterior</a>
        <span th:text="${itens.number + 1} + ' / ' + ${itens.totalPages}">1/1</span>
        <a class="btn pequeno" th:if="${!itens.last}" th:href="@{/poderes(pagina=${itens.number + 1}, q=${q})}">Próxima →</a>
    </div>
</div>
</body>
</html>
